name: Bug
description: "Something does not work: install, a command, a hook, or the Node.js setup."
labels: ["bug"]
body:
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: "Claude Code 2.1.x, or Codex 0.16x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 26, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps, and the command or message you typed.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened
      description: The error or the output. Remove anything private first.
      render: text
    validations:
      required: true
