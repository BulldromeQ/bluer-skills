name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check that the generated plugin files are up to date
        run: |
          npm run build:plugin
          git diff --exit-code -- plugins/claude-code/bin/bluer.mjs skills/bluer/SKILL.md || {
            echo "::error::Generated files are out of date. Run npm run build:plugin and commit plugins/claude-code/bin/bluer.mjs and skills/bluer/SKILL.md."
            exit 1
          }
